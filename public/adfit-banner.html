<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdFit Banner</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .kakao_ad_area {
      display: block;
      margin: 0 auto;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="adfit-wrapper"></div>

  <script type="text/javascript">
    (function() {
      const params = new URLSearchParams(window.location.search);
      const unit = params.get('unit') || 'DAN-EvCbYNj9rO8ZN6jl';
      const width = params.get('width') || '160';
      const height = params.get('height') || '600';

      const wrapper = document.getElementById('adfit-wrapper');
      
      const ins = document.createElement('ins');
      ins.className = 'kakao_ad_area';
      ins.style.width = width + 'px';
      ins.style.height = height + 'px';
      ins.setAttribute('data-ad-unit', unit);
      ins.setAttribute('data-ad-width', width);
      ins.setAttribute('data-ad-height', height);
      wrapper.appendChild(ins);

      const script = document.createElement('script');
      script.type = 'text/javascript';
      script.src = 'https://t1.kakaocdn.net/kas/static/ba.min.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
